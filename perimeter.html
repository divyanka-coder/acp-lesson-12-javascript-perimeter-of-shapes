<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var choice = prompt("WELCOME TO PERIMETER CALCULATOR\n1.perimenter of triangle\n2.perimeter of square\n3.perimeter of rectangle\n4.perimeter of circle\n5.perimeter of rhombus");
        if (choice == "1") {
            var s = Number(prompt("enter the side of triangle"));
            
            var result =s*s*s;
            alert("the perimeter of triangle is " + result);

        }
        if (choice == "2") {
            var s = Number(prompt("enter the side of square"));

            var result = 4*s;
            alert("the perimeter of square is " + result);

        }
        if (choice == "3") {
            var l = Number(prompt("enter the length of rectangle"));
            var b = Number(prompt("enter the breadth of rectangle"));

            var result = 2(l+b);
            alert("the perimeter of rectangle is " + result);

        }
        if (choice == "4") {
            var r = Number(prompt("enter the radius of circle"));


            var result = 2*3.14*r;
            alert("the perimeter of circle is " + result);

        }
        if (choice == "5") {
            var a = Number(prompt("enter the side of rhombus"));
            


            var result = 4*a;
            alert("the  perimeter of rhombus is " + result);

        }

    </script>
</body>
</html>
